<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pick My Pack</title>

<style>

html, body {
margin: 0;
padding: 10px;
text-align: center;
background: black;
}

#resultImage {
width: 100%;
max-width: 900px;
height: auto;
display: block;
margin: 0 auto;
border-radius: 15px;
}

</style>

</head>

<body>

<img id="resultImage" src="" alt="">

<script>

const images = [
    "spooky.gif",
    "commie.gif",
    "chibidisco.gif",
    "babydigimon.gif",
    "hollowsong.gif",
    "legsfordays.gif",
    "pokenomz.gif",
    "quintisetinallyqueer.gif",
    "digibabies.gif",
    "randomonium.gif",
    "triangleguy.gif",
    "sootspirits.gif"
];

const randomImage =
    images[Math.floor(Math.random() * images.length)];

document.getElementById("resultImage").src = randomImage;

</script>

</body>
</html>
