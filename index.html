<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pick My Pack</title>

<style>

html, body {
margin: 0;
padding: 10px;
text-align: center;
background: black;
}

#resultImage {
width: 100%;
max-width: 900px;
height: auto;
display: block;
margin: 0 auto;
border-radius: 15px;
}

</style>

</head>

<body>

<img id="resultImage" src="" alt="">

<script>
 
const images = [
{ file: "commie.gif", weight: 1 },
{ file: "hollowsong.gif", weight: 2 },
{ file: "triangleguy.gif", weight: 3 },
{ file: "chibidisco.gif", weight: 4 },
{ file: "legsfordays.gif", weight: 5 },
{ file: "babydigimon.gif", weight: 7 },
{ file: "spooky.gif", weight: 8 },
{ file: "quintisetinallyqueer.gif", weight: 10 },
{ file: "pokenomz.gif", weight: 12 },
{ file: "digibabies.gif", weight: 14 },
{ file: "sootspirits.gif", weight: 16 },
{ file: "randomonium.gif", weight: 18 }
];
 
// Calculate total weight
const totalWeight = images.reduce(
(sum, item) => sum + item.weight,
0
);
 
// Pick weighted random image
let random = Math.random() * totalWeight;
let selectedImage;
 
for (const item of images) {
random -= item.weight;
if (random < 0) {
selectedImage = item.file;
break;
}
}
 
document.getElementById("resultImage").src = selectedImage;
 
</script>

</body>
</html>
