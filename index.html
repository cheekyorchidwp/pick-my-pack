<html>

<title>Pick My Pack</title>

<style>

html, body {

    width: 100%;

    "babydigimon.gif",
    "hollowsong.gif",
    "legsfordays.gif",
    "pokenomz.gif",
    "quintisetinallyqueer.gif",
    "digibabies.gif",
    "randomonium.gif",
    "triangleguy.gif",
    "sootspirits.gif"
];

const randomImage =
    images[Math.floor(Math.random() * images.length)];

document.getElementById("resultImage").src = randomImage;

</script>
